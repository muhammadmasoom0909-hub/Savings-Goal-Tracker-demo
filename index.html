/* v1.1.8 — strictly scoped Settings / PIN responsive size standard. */
:root{--scale:1;font-size:calc(16px * var(--scale))}
.settings-shell,.settings-shell *, .lock-shell,.lock-shell *{min-width:0;box-sizing:border-box}

.settings-panel .settingsection{padding:26px}
.settings-panel .settingrow{padding:19px 0;gap:24px;min-width:0}
.settings-panel .settingcopy,.settings-panel .settingrow>div:first-child{min-width:0}

.settings-panel .settingcontrol{width:min(100%,180px);max-width:100%;flex-shrink:0}

.settings-panel input:not([type=checkbox]):not([type=radio]),
.settings-panel textarea{max-width:100%;min-height:43px;border-radius:9px;padding:11px 12px}
.settings-panel input[type=checkbox],.settings-panel .settingrow input[type=checkbox],
.lock-shell input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
.settings-panel .toggle,.settings-panel .switch{width:42px;min-width:42px;height:24px;min-height:24px;max-width:42px;flex:0 0 42px;border:0;border-radius:20px;padding:3px;background:var(--line);display:inline-flex;align-items:center;justify-content:flex-start;cursor:pointer;transition:background .15s ease;box-shadow:none}

.settings-panel .settings-original .settingrow{gap:24px;padding:19px 0}
.settings-panel .settings-original .settingrow .actions{min-width:0}

dialog .field input,dialog .field select,dialog .field textarea,
.lock-shell .field input{width:100%;min-height:43px;border-radius:9px;padding:11px 12px;max-width:100%}

/* v1.1.12 — compact Savings Rhythm card only; other dashboard cards untouched */
.dash-home .dash-insight-panel{align-self:start;padding:17px 19px 18px;border-top:2px solid var(--gold);background:linear-gradient(150deg,var(--surface),var(--soft))}
.dash-home .dash-insight-panel .cardhead{margin-bottom:13px;align-items:center;flex-wrap:wrap}
.dash-home .dash-insight-panel .cardhead p:empty{display:none}
.dash-home .dash-insight-stats{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:10px}
.dash-home .dash-insight-stat{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px 13px}
.dash-home .dash-insight-stat>span{font-size:.68rem;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
.dash-home .dash-insight-stat>strong{font-size:1.24rem;line-height:1.25;font-weight:750;letter-spacing:-.035em;overflow-wrap:anywhere}
.dash-home .dash-insight-current{background:var(--gold-soft);border-color:transparent}
.dash-home .dash-insight-current>strong{color:var(--gold-dark)}
@media(max-width:600px){.dash-home .dash-insight-panel{padding:16px}.dash-home .dash-insight-stat{padding:11px}.dash-home .dash-insight-stat>strong{font-size:1.12rem}}

/* Final QA: long currency output fits the 180px number format preview without truncating the value. */
.settings-panel .setting-preview{grid-template-columns:minmax(0,1fr)!important;gap:3px!important;align-items:start!important}
.settings-panel .setting-preview span{justify-self:start!important;white-space:nowrap;font-size:clamp(.67rem,.91rem,1rem)!important;letter-spacing:-.025em;line-height:1.35;font-variant-numeric:tabular-nums}
.settings-panel .setting-preview strong{font-size:.82rem!important}
.settings-panel .setting-preview small{grid-column:1!important;overflow-wrap:anywhere}
.settings-panel .setting-preview{overflow:hidden;min-width:0}

/* Demo-only, deliberately understated controls. Buyer layout and styles otherwise unchanged. */
.demo-top{display:flex;align-items:center;gap:9px;margin-left:auto;min-width:0;white-space:nowrap}
.demo-badge{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--gold-soft);color:var(--gold-dark);border-radius:9px;padding:8px 10px;letter-spacing:.045em;font-size:.65rem;font-weight:800;min-height:34px}
.demo-badge-short{display:none}
.demo-reset-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 10px;font-size:.7rem;font-weight:700;white-space:nowrap}
.demo-reset-btn:hover,.demo-reset-btn:focus-visible{border-color:var(--gold);background:var(--soft)}
.demo-reset-btn svg{width:15px;height:15px}
.demo-intro{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;padding:11px 14px;background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;color:var(--muted);font-size:.77rem}
.demo-intro>div{display:flex;align-items:center;gap:10px;min-width:0;line-height:1.5}
.demo-intro strong{color:var(--text)}
.demo-intro svg{color:var(--gold-dark);width:18px;height:18px}
.demo-intro button{display:grid;place-items:center;flex:0 0 auto;border:0;background:transparent;padding:5px;color:var(--muted)}
.demo-intro button svg{width:16px;height:16px}
.demo-safe-box{border:1px solid var(--line);border-radius:13px;padding:20px;margin-top:14px;background:var(--soft)}
.demo-safe-box h3{font-size:1rem}
.demo-safe-box p{color:var(--muted);line-height:1.65;margin:9px 0 14px}
.demo-safe-box .btn{margin-top:5px}
.topbar .demo-top{flex:0 1 auto}
@media(max-width:1250px){.demo-badge-wide{display:none}.demo-badge-short{display:inline}.demo-top{gap:5px}}
@media(max-width:1060px){.demo-reset-btn span{display:none}.demo-reset-btn{width:35px;padding:6px}}
@media(max-width:720px){.topbar{gap:5px}.topbar .demo-top{margin-left:auto}.demo-badge{padding:5px 7px;font-size:.56rem;min-height:29px}.demo-reset-btn{min-height:31px;width:31px}.demo-intro{font-size:.72rem;line-height:1.45}.demo-safe-box{padding:17px}}
@media(max-width:390px){.topbar .demo-top{gap:4px}.demo-reset-btn{min-height:28px;width:28px}.demo-badge{min-height:27px;padding:5px}.topbar .topactions{gap:3px}}
/* v1.1.14: Mobile and tablet usability only. Desktop styles are unchanged. */
@media (max-width:900px){
  /* 601-780px portrait tablets use the accessible labeled bottom navigation,
     instead of the old narrow/unlabeled desktop navigation rail. */
  .app{display:block;min-width:0}
  .sidebar{display:none}
  .topbar .crumb{display:none}
  .topbar .mobilebrand{display:flex;align-items:center;gap:9px;min-width:0}
  .topbar .quickadd-wrap{display:none!important}
  .topbar{padding:9px 16px;min-height:68px;height:auto}
  .main,.content{min-width:0;max-width:100%}
  .content{padding-bottom:calc(98px + env(safe-area-inset-bottom))}
  .mobilebar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding:7px 6px max(8px,env(safe-area-inset-bottom));box-shadow:0 -9px 28px rgba(61,49,32,.08)}
  .mobilebar>button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.61rem;min-width:0;min-height:52px;justify-content:center;padding:3px}
  .mobilebar>button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mobilebar>button.active{color:var(--gold-dark);font-weight:700}
  .mobilebar>button.add{width:54px;min-width:54px;height:54px;min-height:54px;background:var(--gold);color:#fff;border-radius:17px;justify-self:center;align-self:center;box-shadow:0 7px 18px rgba(168,122,51,.24)}
  .mobilebar>button.add svg{width:27px;height:27px}
  .mobilebar>button:not(.add) svg{width:20px;height:20px}
  .mobile-quickadd-menu{position:fixed;z-index:60;top:auto;bottom:calc(79px + env(safe-area-inset-bottom));left:50%;right:auto;width:min(340px,calc(100vw - 24px));max-width:calc(100vw - 24px);max-height:min(68dvh,485px);overflow-y:auto;transform:translateX(-50%);padding:9px;box-shadow:0 16px 46px rgba(0,0,0,.2);border-radius:16px}
  .mobile-quickadd-menu button{font-size:.83rem;min-height:48px}
  /* Savings accounts: three equally sized actions, no tall vertical stack. */
  .cards .accountcard .actions{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:100%;min-width:0;align-items:stretch}
  .cards .accountcard .actions .btn{width:100%;min-width:0;min-height:40px;padding:8px 4px!important;font-size:.7rem;white-space:nowrap!important;display:flex;align-items:center;justify-content:center;gap:4px;line-height:1.2}
  .cards .accountcard .actions .btn svg{width:15px;height:15px}
  /* Contribution schedules: readable rows with single-line actions.
     The desktop seven-column table is preserved above this breakpoint. */
  .schedule-table{overflow:visible!important;border:0!important;background:transparent!important;box-shadow:none!important}
  .schedule-table>.table{display:block;width:100%;min-width:0!important}
  .schedule-table thead{display:none}
  .schedule-table tbody{display:grid;gap:12px;width:100%}
  .schedule-table tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:11px;width:100%;min-width:0;border:1px solid var(--line);border-radius:15px;padding:16px 15px;background:var(--surface);box-shadow:var(--shadow)}
  .schedule-table tbody td{padding:0!important;margin:0!important;min-width:0;border:0!important;text-align:left!important;font-size:.77rem;line-height:1.35;overflow-wrap:anywhere}
  .schedule-table tbody td:not(.schedule-actions):not(.schedule-empty)::before{content:attr(data-label);display:block;color:var(--muted);font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;line-height:1.2}
  .schedule-table tbody td[data-label="Schedule"] strong,.schedule-table tbody td[data-label="Target"]{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;line-height:1.35}
  .schedule-table tbody td[data-label="Next Date"]{white-space:nowrap;overflow-wrap:normal;font-size:.72rem}
  .schedule-table tbody td[data-label="Amount"]{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
  .schedule-table tbody td[data-label="Status"] .pill{display:inline-flex;align-self:flex-start;width:max-content}
  .schedule-table tbody td.schedule-actions{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-top:11px!important;border-top:1px solid var(--line)!important}
  .schedule-table tbody td.schedule-actions .btn{width:100%;min-width:0;min-height:38px;padding:7px 3px!important;margin:0!important;border-radius:9px;white-space:nowrap!important;line-height:1.2;font-size:.69rem;text-align:center;display:inline-flex;justify-content:center;align-items:center}
  .schedule-table tbody td.schedule-empty{grid-column:1/-1}
  /* Toggles must sit beside their labels, not under the description. */
  .settings-panel .toggle-setting,.settings-panel .settings-original .toggle-setting{display:grid!important;grid-template-columns:minmax(0,1fr) 42px!important;gap:12px!important;align-items:center!important}
  .settings-panel .toggle-setting .settingcopy{min-width:0}
  .settings-panel .toggle-setting .settingcontrol{width:42px!important;min-width:42px;max-width:42px;justify-self:end!important;align-self:center!important;display:flex;align-items:center;justify-content:flex-end!important;margin:0!important}
  /* Category-specific actions may share a single row. */
  .settings-panel .settings-original .settingrow .actions:has([data-action="rename-category"]){display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important;width:100%;min-width:0}
  .settings-panel .settings-original .settingrow .actions:has([data-action="rename-category"]) .btn{width:100%;min-width:0;min-height:40px;padding:8px 10px!important;white-space:normal;line-height:1.2}
  .settings-panel .settings-original .cardhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
  .settings-panel .settings-original .cardhead .btn[data-action="add-category"]{min-width:87px;white-space:nowrap!important;padding:9px 10px!important;gap:6px;font-size:.74rem}
}
@media (min-width:901px) and (max-width:1060px){
  /* Medium tablet landscape: restore readable labels instead of icon-only rail. */
  .app{grid-template-columns:225px minmax(0,1fr)}
  .sidebar{padding:20px 12px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
  .sidebar .brand{justify-content:flex-start!important;gap:9px!important;margin:7px 5px 24px!important}
  .sidebar .brandname{display:flex!important;flex-direction:column;font-size:.83rem!important;white-space:normal}
  .sidebar .brandname span{display:block!important}
  .sidebar .navbtn{justify-content:flex-start!important;padding:10px!important}
  .sidebar .navbtn span{display:inline!important;overflow-wrap:anywhere}
  .sidebar .navgroupbtn{font-size:.6rem!important;letter-spacing:.06em!important}
  .sidebar .navgroupbtn span{display:inline}
  .sidebar .navgroupbtn svg{width:15px}
  .settings-shell{min-width:0}
}
@media (max-width:390px){
  .schedule-table tbody tr{padding:13px 12px;column-gap:9px}
  .schedule-table tbody td.schedule-actions{gap:4px}
  .schedule-table tbody td.schedule-actions .btn{font-size:.65rem;padding:7px 2px!important}
  .cards .accountcard .actions{gap:5px}
  .cards .accountcard .actions .btn{font-size:.66rem}
}
@media (max-width:900px) and (prefers-reduced-motion:reduce){.mobile-quickadd-menu{scroll-behavior:auto}}


/* Demo-specific header fit at tablet and phone widths; buyer desktop remains unchanged. */
@media(max-width:900px){.demo-top{margin-left:auto;flex:0 0 auto}.topbar .topactions{margin-left:0}.topbar .demo-badge{white-space:nowrap}}
@media(max-width:390px){.topbar{padding-inline:10px;gap:4px}.demo-badge{font-size:.54rem}.topbar .topactions{gap:4px}}

function nextScheduleDate(date,freq,customDays=30,anchorDay=null){

function validate(s){

 const lists=['goals','contributions','accounts','sinkingFunds','milestones','goalPlans','monthlyPlans','schedules','challenges','manualCalendarEvents','notifications','dismissedNotifications','categories'];

   if(!x||typeof x.id!=='string'||x.id.length>128||!x.id||seen.has(x.id))throw Error('Backup has duplicate or invalid '+k+' IDs.');

function localeForCurrency(code){const map={USD:'en-US',CAD:'en-CA',AUD:'en-AU',NZD:'en-NZ',GBP:'en-GB',EUR:'de-DE',CHF:'de-CH',SEK:'sv-SE',NOK:'nb-NO',DKK:'da-DK',PLN:'pl-PL',CZK:'cs-CZ',HUF:'hu-HU',RON:'ro-RO',TRY:'tr-TR',RUB:'ru-RU',UAH:'uk-UA',JPY:'ja-JP',CNY:'zh-CN',HKD:'zh-HK',KRW:'ko-KR',INR:'en-IN',PKR:'en-PK',BDT:'bn-BD',LKR:'en-LK',AED:'ar-AE',SAR:'ar-SA',QAR:'ar-QA',KWD:'ar-KW',BHD:'ar-BH',OMR:'ar-OM',EGP:'ar-EG',ZAR:'en-ZA',NGN:'en-NG',KES:'en-KE',GHS:'en-GH',UGX:'en-UG',TZS:'sw-TZ',MXN:'es-MX',ARS:'es-AR',CLP:'es-CL',COP:'es-CO',PEN:'es-PE',UYU:'es-UY',BRL:'pt-BR',MYR:'ms-MY',SGD:'en-SG',IDR:'id-ID',PHP:'en-PH',THB:'th-TH',VND:'vi-VN'};return map[code]||'en-US'}

const fdate=s=>{if(!s)return 'No target date';const [y,m,d]=s.split('-').map(Number);if(state?.prefs.dateFormat==='iso')return s;if(state?.prefs.dateFormat==='dmy')return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;if(state?.prefs.dateFormat==='mdy')return `${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}/${y}`;return new Intl.DateTimeFormat(appLocale(),{day:'numeric',month:'short',year:'numeric'}).format(new Date(Date.UTC(y,m-1,d,12)))};
const targetName=(type,id)=>{const c=type==='goal'?'goals':'sinkingFunds',x=state[c].find(x=>x.id===id);return x?.name||'Unknown'};
const targetIcon=(type,id)=>{const c=type==='goal'?'goals':'sinkingFunds',x=state[c].find(x=>x.id===id);return x?.icon||(type==='goal'?'goal':'vault')};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)};
async function persist(msg){if(saveLock)return;saveLock=true;try{const rev=state.revision;await Storage.save(state,rev);if(msg)toast(msg)}catch(e){toast(e.message);try{state=await Storage.load()}catch{}}finally{saveLock=false;render()}}
function applyTheme(){const root=document.documentElement,p=state.prefs;const theme=p.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p.theme;root.dataset.theme=theme;root.dataset.reduced=String(!!p.reducedMotion);root.style.setProperty('--scale',({small:.90,medium:1,large:1.12,extra:1.25})[p.textSize]||1)}

 data-action="toggle-theme" aria-label="Switch to ${document.documentElement.dataset.theme==='dark'?'light':'dark'} theme" title="Switch to ${document.documentElement.dataset.theme==='dark'?'light':'dark'} theme">${icon(document.documentElement.dataset.theme==='dark'?'sun':'moon')}</button>${state.prefs.pin?.enabled?`<button class="iconbtn top-lock" type="button" data-action="lock-now" aria-label="Lock app" title="Lock app">${icon('lock-keyhole')}</button>`:''}</div></header><div class="content">${route==='dashboard'&&demoIntroVisible()?`<div class="demo-intro" role="note"><div>${icon('sparkles')} <span><strong>Explore with sample savings.</strong> Changes last only for this demo session. Please don't enter real financial information.</span></div><button type="button" data-action="demo-dismiss-intro" aria-label="Dismiss demo introduction">${icon('x')}</button></div>`:''}${content}</div><nav class="mobilebar" aria-label="Mobile navigation"><button class="${route==='dashboard'?'active':''}" data-route="dashboard">${icon('layout-dashboard')}<span>${routeLabel('dashboard')}</span></button><button class="${route==='goals'?'active':''}" data-route="goals">${icon('goal')}<span>${ui('goalsShort','Goals')}</span></button><button class="add mobile-quick-trigger" type="button" data-action="quick-menu-mobile" aria-label="${ui('quickAdd','Quick Add')}" title="${ui('quickAdd','Quick Add')}" aria-expanded="false" aria-controls="mobile-quickadd-menu">${icon('plus')}</button><button class="${route==='contributions'?'active':''}" data-route="contributions">${icon('piggy-bank')}<span>${routeLabel('contributions')}</span></button><button data-action="mobile-more">${icon('menu')}<span>${ui('more','More')}</span></button><div id="mobile-quickadd-menu" class="quickadd-menu mobile-quickadd-menu" hidden>${quickMenuContents()}</div></nav></main></div>`
}
function pageTitle(){return route==='settings'?routeLabel('settings'):routeLabel(route)}
function notificationEnabled(n){const a=state.prefs.alerts,key=String(n.key||'');if(key.startsWith('milestone:'))return a.milestone!==false;if(key.startsWith('target:'))return a.targetReached!==false;if(key.startsWith('goaldate:'))return a.targetDate!==false;if(key.startsWith('backup:'))return a.backup===true;if(key.startsWith('schedule:')){const scheduleId=key.split(':')[1],schedule=state.schedules.find(x=>x.id===scheduleId);if(schedule){if(schedule.targetType==='goal'&&a.goalReminder===false)return false;if(schedule.targetType==='sinking'&&a.sinkingReminder===false)return false;if(schedule.targetType==='challenge'&&a.challenge===false)return false}if(key.includes('Missed contribution'))return a.scheduleMissed!==false;if(key.includes('Due today'))return a.scheduleDue!==false;return a.scheduleUpcoming!==false}return true}
function notificationPanel(){const rows=state.notifications.filter(n=>notificationEnabled(n)&&!state.dismissedNotifications.includes(n.key)).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,12);if(!rows.length)return `<div class="noticeitem"><strong>${ui('allClear','All clear')}</strong><p>${ui('noNotifications','No savings notifications right now.')}</p></div>`;return `<div style="padding:7px 8px;display:flex;justify-content:space-between"><strong style="font-size:.78rem">${ui('notifications','Notifications')}</strong><button class="linkbtn" data-action="mark-all">${ui('markAllRead','Mark all read')}</button></div>`+rows.map(n=>`<div class="noticeitem ${n.read?'':'unread'}"><strong>${esc(n.title)}</strong><p>${esc(n.message)}${n.date?' · '+fdate(n.date):''}</p><div class="noticeactions">${n.read?'':`<button data-action="mark-read" data-id="${n.id}">Mark read</button>`}<button data-action="dismiss-note" data-id="${n.id}">Dismiss</button></div></div>`).join('')}

function dashboard(){
const now=Savings.today(),month=now.slice(0,7),stats=Savings.goalStats(state);
const goals=state.goals.filter(g=>g.status==='active').sort((a,b)=>Number(!!b.highlight)-Number(!!a.highlight)||(a.targetDate||'9999').localeCompare(b.targetDate||'9999'));
const funds=state.sinkingFunds.filter(f=>f.status==='active');
const savedFunds=Savings.sum(funds,f=>Savings.targetSaved(state,'sinking',f.id));
const targetFunds=Savings.sum(funds,f=>f.target);
const actual=Savings.monthlyActual(state,month),plan=state.monthlyPlans.find(p=>p.month===month),target=plan?.target||0;
const lastMonth=Savings.monthShift(month,-1),previous=Savings.monthlyActual(state,lastMonth);

const head=pageHead('Your savings at a glance','Dashboard','Your real savings progress, next steps and recent activity — all in one place.',`<button class="btn" data-action="add-goal">${icon('plus')} New goal</button><button class="btn primary" data-action="add-contribution">${icon('plus')} Add contribution</button>`);
if(!state.goals.length&&!state.sinkingFunds.length&&!state.contributions.length){

}

 const saved=Savings.targetSaved(state,'goal',g.id),pc=clamp(g.target?saved/g.target*100:0),remaining=Math.max(0,g.target-saved);

const monthlyMarkup=target?`<div class="dash-month-main"><div><div class="dash-label">Saved this month</div><strong class="dash-month-amount num">${money(actual)}</strong><p>of ${money(target)} planned</p></div><div class="dash-month-ring" style="--dp:${clamp(actual/target*100)}"><div><strong>${percentage(Math.min(1,actual/target))}</strong><small>complete</small></div></div></div><div class="dash-track"><span style="width:${clamp(actual/target*100)}%"></span></div><div class="dash-month-bottom"><div><span>Still to save</span><strong>${money(Math.max(0,target-actual))}</strong></div><div><span>Days left</span><strong>${daysLeft}</strong></div></div>`:`<div class="dash-month-main"><div><div class="dash-label">Saved this month</div><strong class="dash-month-amount num">${money(actual)}</strong><p>Real contributions in ${monthName}</p></div><div class="dash-month-glyph">${icon('calendar-days')}</div></div><div class="dash-month-bottom"><div><span>Previous month</span><strong>${money(previous)}</strong></div><div><span>Days left this month</span><strong>${daysLeft}</strong></div></div>${state.prefs.modules.monthlyPlans?`<button class="btn soft small dash-plan-cta" data-action="monthly-plan">${icon('plus')} Set a monthly savings plan</button>`:''}`;

function monthly(){const m=Savings.today().slice(0,7),p=state.monthlyPlans.find(x=>x.month===m),actual=Savings.monthlyActual(state,m),target=p?.target||0;return pageHead('Planning','Monthly Savings Plan','Decide how much to save this month and allocate it across goals or funds — without expense budgeting.',`<button class="btn primary" data-action="monthly-plan">${p?'Edit':'Create'} ${new Intl.DateTimeFormat(appLocale(),{month:'long'}).format(new Date(m+'-01T12:00:00Z'))} Plan</button>`)+summary([{l:'Planned',v:fmt(target)},{l:'Actual Saved',v:fmt(actual)},{l:'Remaining',v:fmt(Math.max(0,target-actual))},{l:'Completion',v:pct(target?Math.min(1,actual/target):0)}])+`<section class="card pad"><div class="cardhead"><div><h2>Allocation</h2><p>Planned allocation versus actual posted contributions this month.</p></div></div>${p?.allocations?.length?p.allocations.map(a=>{const [start,end]=Savings.monthRange(m);const actualTarget=Savings.sum(state.contributions.filter(c=>c.targetType===a.targetType&&c.targetId===a.targetId&&c.date>=start&&c.date<=end),c=>c.amount);return `<div class="fundrow"><div class="rowicon">${icon(targetIcon(a.targetType,a.targetId))}</div><div><div class="rowtitle">${esc(targetName(a.targetType,a.targetId))}</div><div class="rowmeta">Planned ${fmt(a.amount)} · actual ${fmt(actualTarget)}</div><div class="progress"><span style="width:${Math.min(100,a.amount?actualTarget/a.amount*100:0)}%"></span></div></div><span class="pill ${actualTarget>=a.amount?'sage':'gold'}">${pct(a.amount?Math.min(1,actualTarget/a.amount):0)}</span></div>`}).join(''):`<div class="empty" style="padding:32px"><p>No monthly allocation yet.</p></div>`}</section>`}
function schedules(){return pageHead('Planning','Contribution Schedule','Plan weekly, biweekly, monthly, or custom savings. A schedule never changes saved totals until you post it.',`<button class="btn primary" data-action="add-schedule">${icon('plus')} New Schedule</button>`)+`<section class="card tablewrap schedule-table"><table class="table"><thead><tr><th>Schedule</th><th>Target</th><th>Frequency</th><th>Next Date</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody>${state.schedules.length?state.schedules.map(x=>`<tr><td data-label="Schedule"><strong>${esc(x.name)}</strong></td><td data-label="Target">${esc(x.targetType==='challenge'?state.challenges.find(c=>c.id===x.targetId)?.name:targetName(x.targetType,x.targetId))}</td><td data-label="Frequency">${esc(x.frequency)}</td><td data-label="Next Date">${fdate(x.nextDate)}</td><td class="right" data-label="Amount">${fmt(x.amount)}</td><td data-label="Status"><span class="pill ${x.active?'sage':''}">${x.active?'Active':'Paused'}</span></td><td class="right schedule-actions" data-label="Actions"><button class="btn small primary" data-action="post-schedule" data-id="${x.id}" ${x.active?'':'disabled title="Resume schedule before posting"'}>Post</button> <button class="btn small" data-action="toggle-schedule" data-id="${x.id}">${x.active?'Pause':'Resume'}</button> <button class="btn small" data-action="edit-schedule" data-id="${x.id}">Edit</button> <button class="btn small danger" data-action="delete-schedule" data-id="${x.id}">Delete</button></td></tr>`).join(''):`<tr><td colspan="7" class="muted schedule-empty">No contribution schedules yet.</td></tr>`}</tbody></table></section>`}
function challenges(){const rows=state.challenges.slice().sort(statusSort);return pageHead('Planning','Challenges','Turn a saving intention into a motivating challenge. Linked goal contributions are recorded separately.',`<button class="btn primary" data-action="add-challenge">${icon('plus')} New Challenge</button>`)+`<div class="cards">${rows.length?rows.map(ch=>{const pr=Savings.challengeProgress(state,ch),met=pr.amount>=ch.target,primary=ch.status==='active'&&met?`<button class="btn primary record-primary" data-action="challenge-status" data-id="${ch.id}" data-status="completed">Mark Complete</button>`:ch.status==='active'&&ch.linkedGoalId?`<button class="btn primary record-primary" data-action="quick-contribute" data-target-type="goal" data-target-id="${ch.linkedGoalId}" data-challenge-id="${ch.id}">${icon('plus')} Save to Linked Goal</button>`:ch.status==='active'?`<button class="btn primary record-primary" data-action="edit-challenge" data-id="${ch.id}">Link a Goal</button>`:ch.status==='paused'?`<button class="btn primary record-primary" data-action="challenge-status" data-id="${ch.id}" data-status="active">Resume Challenge</button>`:`<button class="btn record-primary" disabled>${esc(ch.status)}</button>`;const menu=[recordButton('edit-challenge',ch.id,'Edit challenge'),ch.status==='active'?recordButton('challenge-status',ch.id,'Pause challenge','data-status="paused"'):null,ch.status==='paused'?recordButton('challenge-status',ch.id,'Resume challenge','data-status="active"'):null,ch.status==='completed'?recordButton('challenge-status',ch.id,'Reopen challenge','data-status="active"'):null,ch.status==='active'&&met?recordButton('challenge-status',ch.id,'Mark complete','data-status="completed"'):null,ch.status!=='archived'?recordButton('challenge-status',ch.id,'Archive challenge','data-status="archived"'):null,ch.status==='archived'?recordButton('challenge-status',ch.id,'Restore challenge','data-status="active"'):null,recordButton('delete-challenge',ch.id,'Delete challenge','data-danger="true"')];return `<article class="card managecard"><div class="managehead"><div class="goalicon">${icon('sprout')}</div><span class="pill ${ch.status==='active'?'sage':''}">${esc(ch.status)}</span></div><div><h3>${esc(ch.name)}</h3><div class="rowmeta">${esc(ch.type)} · ${ch.durationDays} days · ${esc(ch.pattern)}</div></div><div class="manageamount num">${fmt(pr.amount)}</div><div class="progress"><span style="width:${pr.progress*100}%"></span></div><div class="managefacts"><div><span>Target</span><strong>${fmt(ch.target)}</strong></div><div><span>Progress</span><strong>${pct(pr.progress)}</strong></div></div><div class="record-actions">${primary}${recordMenu('challenge',ch.id,menu)}</div></article>`}).join(''):`<section class="card empty"><p>No challenges started.</p><button class="btn primary" data-action="add-challenge">Start a challenge</button></section>`}</div>`}

function calendar(){const [start,end]=Savings.monthRange(calendarMonth),d=new Date(start+'T12:00:00Z'),first=(d.getUTCDay()+6)%7,days=Number(end.slice(8)),prev=Savings.monthShift(calendarMonth,-1),prevDays=Number(Savings.monthRange(prev)[1].slice(8)),cells=[];for(let i=0;i<42;i++){let date,muted=false,num;if(i<first){num=prevDays-first+i+1;date=prev+'-'+String(num).padStart(2,'0');muted=true}else if(i>=first+days){num=i-first-days+1;date=Savings.monthShift(calendarMonth,1)+'-'+String(num).padStart(2,'0');muted=true}else{num=i-first+1;date=calendarMonth+'-'+String(num).padStart(2,'0')}const events=calendarEvents(date);cells.push(`<div class="calday ${muted?'mutedday':''}"><div class="calnum">${num}</div>${events.slice(0,3).map((e,i)=>`<button type="button" class="calevent ${e.k}" data-action="calendar-detail" data-date="${date}" data-event="${i}" title="${esc(e.title)}">${esc(e.title)}</button>`).join('')}${events.length>3?`<button class="cal-more" data-action="calendar-detail" data-date="${date}" data-event="all">+${events.length-3} more</button>`:''}</div>`)}return pageHead('Planning','Savings Calendar','Select an event to see its date, amount, source and what action is needed.',`<button class="btn" data-action="cal-prev">${icon('chevron-left')}</button><button class="btn" data-action="cal-today">Today</button><button class="btn" data-action="cal-next">${icon('chevron-right')}</button>`)+`<section class="card pad"><div class="cardhead"><div><h2>${new Intl.DateTimeFormat(appLocale(),{month:'long',year:'numeric'}).format(new Date(calendarMonth+'-01T12:00:00Z'))}</h2><p>Gold = planned / target · Sage = actual / achieved · Click any event for details</p></div></div><div class="calendarwrap"><div class="calendargrid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="calday calweekday">${x}</div>`).join('')}${cells.join('')}</div></div></section>`}
function calendarEvents(date){const events=[];state.contributions.filter(c=>c.date===date).forEach(c=>events.push({title:targetName(c.targetType,c.targetId)+' · '+fmt(c.amount),k:'actual',type:'Posted contribution',amount:fmt(c.amount),date,subtitle:targetName(c.targetType,c.targetId),note:c.notes||'This saving has already been recorded in your progress.',status:'Recorded'}));state.schedules.filter(s=>s.active&&s.nextDate===date).forEach(x=>events.push({title:x.name+' · '+fmt(x.amount),k:'',type:'Planned contribution',amount:fmt(x.amount),date,subtitle:x.name,note:'Planned only. Open Contribution Schedule to post it when due; it is not yet included in saved totals.',status:date<Savings.today()?'Past due':'Upcoming'}));state.goals.filter(g=>g.targetDate===date).forEach(g=>events.push({title:g.name+' · Target date',k:'',type:'Savings goal deadline',amount:fmt(g.target),date,subtitle:g.name,note:'Current saved: '+fmt(Savings.targetSaved(state,'goal',g.id))+' · Remaining: '+fmt(Math.max(0,g.target-Savings.targetSaved(state,'goal',g.id))),status:g.status}));state.sinkingFunds.filter(f=>f.targetDate===date).forEach(f=>events.push({title:f.name+' · Fund target',k:'',type:'Sinking fund deadline',amount:fmt(f.target),date,subtitle:f.name,note:'Current saved: '+fmt(Savings.targetSaved(state,'sinking',f.id))+' · Remaining: '+fmt(Math.max(0,f.target-Savings.targetSaved(state,'sinking',f.id))),status:f.status}));state.milestones.filter(m=>m.achievedDate===date).forEach(m=>events.push({title:targetName(m.targetType,m.targetId)+' · '+m.percent+'%',k:'actual',type:'Milestone achieved',amount:fmt(m.amount),date,subtitle:targetName(m.targetType,m.targetId),note:'This milestone was earned from actual savings progress.',status:'Achieved'}));return events}
function showCalendarDetails(date,index){const list=calendarEvents(date),items=index==='all'?list:[list[Number(index)]].filter(Boolean);if(!items.length)return;const d=document.createElement('dialog');d.className='event-dialog';d.innerHTML=`<div class="dialoghead"><div><h2>${fdate(date)}</h2><p>${items.length} calendar ${items.length===1?'event':'events'}</p></div><button class="iconbtn" data-event-close aria-label="Close">${icon('x')}</button></div><div class="event-dialog-list">${items.map(x=>`<section class="event-detail-card"><div><span class="event-detail-kind">${esc(x.type)}</span><span class="pill ${x.k==='actual'?'sage':'gold'}">${esc(x.status)}</span></div><h3>${esc(x.subtitle)}</h3><strong class="num">${esc(x.amount)}</strong><p>${esc(x.note)}</p></section>`).join('')}</div><div class="dialogfoot"><button class="btn primary" data-event-close>Close details</button></div>`;document.body.appendChild(d);d.showModal();d.querySelectorAll('[data-event-close]').forEach(b=>b.onclick=()=>d.close());d.addEventListener('close',()=>d.remove())}

function reportTrend(months){if(!months.length)return `<div class="empty"><p>No contributions in this period.</p></div>`;const w=650,h=252,padX=60,padTop=24,padBottom=32,max=Math.max(1,...months.map(x=>x.amount));const usableW=w-padX-20,usableH=h-padTop-padBottom;const points=months.map((x,i)=>({x:months.length===1?padX+usableW/2:padX+i/(months.length-1)*usableW,y:padTop+usableH-(x.amount/max)*usableH,row:x}));const baseline=h-padBottom;const area=`M ${points[0].x} ${baseline} `+points.map(p=>`L ${p.x} ${p.y}`).join(' ')+` L ${points[points.length-1].x} ${baseline} Z`;const line=points.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');const avg=Math.round(months.reduce((n,x)=>n+x.amount,0)/months.length),latest=months[months.length-1];return `<div class="report-trend new-chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Monthly posted savings line graph">${[0,.25,.5,.75,1].map(n=>{const y=baseline-n*usableH;return `<line class="gridline" x1="${padX}" x2="${w-20}" y1="${y}" y2="${y}"></line><text class="chart-tick" x="${padX-8}" y="${y+4}" text-anchor="end">${esc(fmt(Math.round(max*n)))}</text>`}).join('')}<path class="trend-area" d="${area}"></path><path class="trend-line" d="${line}"></path>${points.map(p=>`<circle class="trend-dot" cx="${p.x}" cy="${p.y}" r="5"><title>${esc(p.row.month)} · ${fmt(p.row.amount)}</title></circle>`).join('')}${points.map(p=>`<text class="chart-x-label" x="${p.x}" y="${h-7}" text-anchor="middle">${new Intl.DateTimeFormat(appLocale(),{month:'short'}).format(new Date(p.row.month+'-01T12:00:00Z'))}</text>`).join('')}</svg></div><div class="trend-summary"><div><span>Average active month</span><strong>${fmt(avg)}</strong></div><div style="text-align:right"><span>Latest plotted month</span><strong>${fmt(latest.amount)}</strong></div></div>`}

function analyticsMonths(count=6){const now=Savings.today().slice(0,7),map=new Map();state.contributions.forEach(c=>map.set(c.date.slice(0,7),(map.get(c.date.slice(0,7))||0)+c.amount));return Array.from({length:count},(_,i)=>{const month=Savings.monthShift(now,i-count+1);return {month,amount:map.get(month)||0}})}
function reportDetails(start,end,r){const months=[];let m=start.slice(0,7),last=end.slice(0,7),guard=0;while(m<=last&&guard++<120){const amount=r.months.find(x=>x.month===m)?.amount||0;const rows=state.contributions.filter(c=>c.date>=start&&c.date<=end&&c.date.slice(0,7)===m);months.push({month:m,amount,count:rows.length});m=Savings.monthShift(m,1)}const active=months.filter(x=>x.count>0),max=Math.max(1,...months.map(x=>x.amount));const top=active.slice().sort((a,b)=>b.amount-a.amount)[0],total=active.reduce((n,x)=>n+x.amount,0),goals=state.contributions.filter(c=>c.date>=start&&c.date<=end&&c.targetType==='goal'),funds=state.contributions.filter(c=>c.date>=start&&c.date<=end&&c.targetType==='sinking');const goalTotal=Savings.sum(goals,c=>c.amount),fundTotal=Savings.sum(funds,c=>c.amount);return `<section class="card pad report-breakdown"><div class="cardhead"><div><h2>Monthly Savings Breakdown</h2><p>Every month within your selected period, including months without contributions.</p></div>${top?`<span class="pill sage">Best month: ${esc(top.month)}</span>`:''}</div><div class="report-month-table"><div class="report-month-head"><span>Month</span><span>Saved amount</span><span>Contributions</span></div>${months.map(x=>`<div class="report-month-row"><span>${new Intl.DateTimeFormat(appLocale(),{month:'short',year:'numeric'}).format(new Date(x.month+'-01T12:00:00Z'))}</span><div class="report-month-middle"><strong>${fmt(x.amount)}</strong><div class="report-mini-track"><span style="width:${x.amount/max*100}%"></span></div></div><span>${x.count}</span></div>`).join('')}</div><div class="report-mix"><div><span>${icon('target')} Saved to Goals</span><strong>${fmt(goalTotal)}</strong><small>${total?Math.round(goalTotal/total*100):0}% of period total</small></div><div><span>${icon('vault')} Saved to Sinking Funds</span><strong>${fmt(fundTotal)}</strong><small>${total?Math.round(fundTotal/total*100):0}% of period total</small></div><div><span>${icon('calendar-check')} Months with Saving</span><strong>${active.length} / ${months.length}</strong><small>Only posted contributions count</small></div></div></section>`}
function reports(){const [a,b]=Savings.periodRange(reportPeriod,state,reportCustom),r=Savings.report(state,a,b);return pageHead('Insights','Progress Reports','Real contribution and savings progress reporting across flexible periods.',r.count?`<button class="btn" data-action="print-report">Print / Save PDF</button>`:'')+`<div class="toolbar"><div class="field"><label>Period</label><select id="report-period"><option value="month" ${reportPeriod==='month'?'selected':''}>This Month</option><option value="lastMonth" ${reportPeriod==='lastMonth'?'selected':''}>Last Month</option><option value="3m" ${reportPeriod==='3m'?'selected':''}>Last 3 Months</option><option value="6m" ${reportPeriod==='6m'?'selected':''}>Last 6 Months</option><option value="year" ${reportPeriod==='year'?'selected':''}>This Year</option><option value="all" ${reportPeriod==='all'?'selected':''}>All Time</option><option value="custom" ${reportPeriod==='custom'?'selected':''}>Custom Range</option></select></div>${reportPeriod==='custom'?`<div class="field"><label>Start</label><input id="report-start" type="date" value="${reportCustom.start}"></div><div class="field"><label>End</label><input id="report-end" type="date" value="${reportCustom.end}"></div><button class="btn" data-action="apply-report">Apply</button>`:''}</div>`+summary([{l:'Saved in Period',v:fmt(r.total)},{l:'Contributions',v:r.count},{l:'Average Contribution',v:fmt(r.average)},{l:'Period',v:`<span class="report-period-value">${fdate(a)} – ${fdate(b)}</span>`}])+`<div class="two grid report-grid"><section class="card pad report-trend-card"><div class="cardhead"><div><h2>Contributions Over Time</h2><p>Monthly posted contributions in the selected period.</p></div>${r.months.length?`<span class="pill sage">${r.months.length} month${r.months.length===1?'':'s'}</span>`:''}</div>${reportTrend(r.months)}</section><section class="card pad"><div class="cardhead"><div><h2>Goal Progress</h2><p>Current progress across active goals.</p></div></div>${state.goals.filter(g=>g.status==='active').map(g=>`<div class="fundrow"><div class="rowicon">${icon(g.icon||'goal')}</div><div><div class="rowtitle">${esc(g.name)}</div><div class="rowmeta">${fmt(Savings.targetSaved(state,'goal',g.id))} / ${fmt(g.target)}</div><div class="progress"><span style="width:${Savings.progress(Savings.targetSaved(state,'goal',g.id),g.target)*100}%"></span></div></div><span class="pill sage">${pct(Savings.progress(Savings.targetSaved(state,'goal',g.id),g.target))}</span></div>`).join('')||`<div class="muted">No active goals.</div>`}</section></div>${reportDetails(a,b,r)}`}
function history(){const goals=state.goals.filter(g=>['completed','archived','paused'].includes(g.status));return pageHead('Insights','Goal History','Review completed, archived, and paused goals without duplicating the active-goal workspace.')+`<section class="card tablewrap"><table class="table"><thead><tr><th>Goal</th><th>Status</th><th>Created</th><th>Completed</th><th class="right">Final / Current Saved</th><th class="right">Target</th></tr></thead><tbody>${goals.length?goals.map(g=>`<tr><td><strong>${esc(g.name)}</strong></td><td><span class="pill ${g.status==='completed'?'sage':''}">${esc(g.status)}</span></td><td>${fdate(g.createdAt.slice(0,10))}</td><td>${g.completedAt?fdate(g.completedAt.slice(0,10)):'—'}</td><td class="right">${fmt(Savings.targetSaved(state,'goal',g.id))}</td><td class="right">${fmt(g.target)}</td></tr>`).join(''):`<tr><td colspan="6" class="muted">No historical goals yet.</td></tr>`}</tbody></table></section>`}
function analytics(){const a=Savings.analytics(state),funded=a.mostFunded?state.goals.find(g=>g.id===a.mostFunded.goalId):null,months=analyticsMonths(6),monthMax=Math.max(1,...months.map(x=>x.amount)),bestKey=a.bestMonth?.month||'',fundedSaved=a.mostFunded?.amount||0,fundedProgress=funded?Savings.progress(fundedSaved,funded.target):0,totalGoalSaved=state.contributions.filter(c=>c.targetType==='goal').reduce((n,c)=>n+c.amount,0),fundedShare=totalGoalSaved?fundedSaved/totalGoalSaved:0,activeMonths=months.filter(x=>x.amount>0).length;return pageHead('Insights','Savings Analytics','Useful calculations based only on your real saved data.',state.contributions.length?`<button class="btn" data-action="print-report">Print / Save PDF</button>`:'')+summary([{l:'Total Saved',v:fmt(a.total)},{l:'Average Monthly',v:fmt(a.averageMonthly)},{l:'Average Contribution',v:fmt(a.averageContribution)},{l:'Goal Completion Rate',v:pct(a.completionRate)}])+`<div class="three grid analytics-grid"><section class="card analytics-card"><div class="eyebrow">Best Saving Month</div><div class="analytics-primary">${a.bestMonth?fmt(a.bestMonth.amount):'—'}</div><div class="analytics-sub">${a.bestMonth?new Intl.DateTimeFormat(appLocale(),{month:'long',year:'numeric'}).format(new Date(a.bestMonth.month+'-01T12:00:00')):'Not enough data yet'}</div><div class="mini-months" aria-label="Last six months saving activity">${months.map(x=>`<div class="mini-month ${x.month===bestKey?'best':''}" title="${x.month} · ${fmt(x.amount)}"><i style="height:${Math.max(3,x.amount/monthMax*100)}%"></i><small>${new Intl.DateTimeFormat(appLocale(),{month:'short'}).format(new Date(x.month+'-01T12:00:00'))}</small></div>`).join('')}</div></section><section class="card analytics-card"><div class="eyebrow">Most Funded Goal</div><div class="analytics-primary" style="font-size:1.35rem">${funded?esc(funded.name):'—'}</div><div class="analytics-sub">${funded?'Your largest goal contribution total.':'Add goal contributions to calculate.'}</div>${funded?`<div class="funded-visual"><div class="analytics-ring" style="--p:${Math.round(fundedProgress*100)}"><div><strong>${pct(fundedProgress)}</strong><small>of target</small></div></div><div class="analytics-facts"><div><span>Funded amount</span><strong>${fmt(fundedSaved)}</strong></div><div><span>Goal target</span><strong>${fmt(funded.target)}</strong></div><div><span>Share of goal savings</span><strong>${pct(fundedShare)}</strong></div></div></div>`:`<div class="empty"><p>No funded goals yet.</p></div>`}</section><section class="card analytics-card"><div class="eyebrow">Contribution Consistency</div><div class="analytics-sub">How regularly saving activity appears across your active saving history.</div><div class="consistency-row"><div class="consistency-dial" style="--p:${Math.round(a.consistency*100)}"><strong>${pct(a.consistency)}</strong></div><div class="activity-months">${months.map(x=>`<div class="activity-month ${x.amount>0?'on':''}" title="${x.month} · ${fmt(x.amount)}"><strong>${new Intl.DateTimeFormat(appLocale(),{month:'short'}).format(new Date(x.month+'-01T12:00:00'))}</strong><small>${x.amount?fmt(x.amount):'No saving'}</small></div>`).join('')}</div></div><div class="trend-summary consistency-summary"><div><span>Active in last 6 months</span><strong>${activeMonths} / 6</strong></div><div><span>Overall consistency</span><strong>${pct(a.consistency)}</strong></div></div></section></div>`}

return `<section class="card settingsection help-section">${settingHero('Help & About','Complete guidance for beginners and advanced users.')}<div class="help-topgrid"><div class="help-callout"><h3>For beginners</h3><p>Start simple: create a goal, post real contributions, then review your progress in Dashboard, Reports and Analytics.</p></div><div class="help-callout"><h3>For regular users</h3><p>Use plans, schedules, challenges, accounts and calendar views to stay organized without losing sight of actual saved money.</p></div><div class="help-callout"><h3>For advanced users</h3><p>Back up regularly, manage visibility with Navigation Management, and use PIN Lock only as a local screen barrier — not full encryption.</p></div></div><div class="help-intro"><h3>How this app works</h3><p>Savings Goal Tracker is a local-first savings workspace. A clean workflow is: choose a goal or fund → add actual contributions → plan future saving with schedules or monthly plans → review progress in reports, history and analytics.</p></div><div class="help-grid">${[

['Dashboard',`The Dashboard is your savings control center. It highlights active-goal progress, this month’s saving, recent contributions, upcoming schedules, milestone moments, sinking funds and a calculated savings insight. If something looks wrong here, open the source record in Goals, Contributions, Schedules or Monthly Savings Plan.`],
['Savings Goals',`Use Savings Goals for outcomes you want to build toward, such as an emergency fund, trip, home deposit or device purchase.<ul><li><strong>Add Contribution:</strong> record real money saved for that goal.</li><li><strong>Edit / Pause / Archive:</strong> available from the More menu as needed.</li><li><strong>Complete:</strong> appears when the goal is fully funded and stops extra contributing.</li><li><strong>Delete:</strong> use only when you truly want to remove the goal and its linked history.</li></ul>`],

['Savings Accounts',`Savings Accounts answer “where does my saved money live?” They are simple storage containers such as bank, cash or reserve buckets. Add an opening balance and balance-as-of date, then optionally link contributions or goals. The opening balance itself is not contribution history.`],

['Milestones',`Milestones are generated from real progress, including 25%, 50%, 75% and 100%. They help users see momentum without opening every goal one by one.`],
['Goal Planner',`Goal Planner helps answer “How much should I save?” Enter a target, current saved amount, target date and contribution frequency, then compare possible saving scenarios.`],

['Contribution Schedule',`Schedules are reminders/plans for future saving. Weekly, biweekly and monthly schedules do <strong>not</strong> change saved totals until you choose to post them.`],
['Challenges',`Savings Challenges are structured saving pushes. Keep the main action visible on each challenge card, while secondary actions can live in More.`],
['Calendar',`The Savings Calendar combines schedules, posted contributions, target dates and milestones into one month view. Click an event to see its source details and next recommended action.`],
['Progress Reports',`Use period filters to inspect real progress over time. Reports should help users answer: “How much did I save?”, “Which month was strongest?”, and “Which goals or funds are moving well?”`],

function actionRow(title,desc,controls){return `<div class="settingrow action-row"><div class="settingcopy"><h3>${title}</h3><p>${desc}</p></div><div class="settingcontrol">${controls}</div></div>`}
function numberFormatRow(){const locale=state.prefs.numberFormat||localeForCurrency(state.prefs.currency||'USD');let preview='';try{preview=new Intl.NumberFormat(locale,{style:'currency',currency:state.prefs.currency||'USD',maximumFractionDigits:2}).format(100000)}catch{preview=`${state.prefs.currency||'USD'} 100,000.00`}return `<div class="settingrow static-row"><div class="settingcopy"><h3>Number format</h3><p>Selected automatically from your currency so entries and totals stay consistent.</p></div><div class="setting-preview"><strong>${locale}</strong><span>${preview}</span><small>Automatic for <b>${esc(state.prefs.currency||'USD')}</b></small></div></div>`}
function currencySetting(codes){const selected=state.prefs.currency||'USD';const nameOf=c=>{try{return new Intl.DisplayNames([appLocale()],{type:'currency'}).of(c)||c}catch{return c}};return `<div class="settingrow currency-setting"><div class="settingcopy"><h3>Currency</h3><p>Changing the code relabels stored amounts; it never performs currency conversion.</p></div><div class="settingcontrol currency-picker"><input id="currency-search" class="currency-search" type="search" value="${esc(selected)}" autocomplete="off" spellcheck="false" placeholder="Type a 3-letter currency code" aria-label="Search currencies"><small>Type a 3-letter currency code, then choose a suggestion.</small><div id="currency-options" class="currency-options" role="listbox" aria-label="Supported currencies" hidden>${codes.map(c=>`<button type="button" role="option" class="currency-option ${c===selected?'selected':''}" data-currency="${c}" aria-selected="${c===selected}"><strong>${c}</strong><span>${esc(nameOf(c))}</span>${c===selected?'<em>✓</em>':''}</button>`).join('')}</div></div></div>`}
function selectSetting(label,desc,key,options){if(Array.isArray(key)){options=key;key=desc;desc='Saved locally for this app.'}const normalized=(options||[]).map(o=>Array.isArray(o)?o:[o,o]);return `<div class="settingrow"><div class="settingcopy"><h3>${label}</h3><p>${desc}</p></div><div class="settingcontrol"><select data-setting="${key}" aria-label="${esc(label)}">${normalized.map(([value,text])=>`<option value="${value}" ${state.prefs[key]===value?'selected':''}>${text}</option>`).join('')}</select></div></div>`}
function toggleRow(title,desc,key,on){return `<div class="settingrow toggle-setting"><div class="settingcopy"><h3>${title}</h3><p>${desc}</p></div><div class="settingcontrol"><button class="toggle ${on?'on':''}" data-toggle="${key}" aria-pressed="${on}" aria-label="${esc(title)}"><span></span></button></div></div>`}
function render(){const keepSettingsScroll=route==='settings'&&!!document.querySelector('#app .settings-shell');const savedY=keepSettingsScroll?(document.scrollingElement?.scrollTop||window.scrollY):0;const savedTabX=keepSettingsScroll?(document.querySelector('#app .settings-side')?.scrollLeft||0):0;Savings.generateNotifications(state);applyTheme();let c;try{c=({dashboard,goals,contributions,accounts,sinking,milestones,planner,monthly,schedules,challenges,calendar,reports,history,analytics,settings}[route]||dashboard)()}catch(e){c=pageHead('Savings Goal Tracker','Something needs attention',e.message)+`<section class="card empty"><button class="btn" data-route="dashboard">Return to Dashboard</button></section>`}$('#app').innerHTML=shell(c);bindDynamic();localizeTree($('#app'));if(keepSettingsScroll){const side=document.querySelector('#app .settings-side');if(side)side.scrollLeft=savedTabX;window.scrollTo(0,savedY)}}
function bindDynamic(){const pf=$('#planner-form');if(pf)pf.addEventListener('submit',e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(pf));const r=Savings.planner(d);$('#planner-results').innerHTML=plannerResult(r)}catch(err){toast(err.message)}});const rp=$('#report-period');if(rp)rp.onchange=()=>{reportPeriod=rp.value;render()}}
function formDialog(title,subtitle,fields,values,onSubmit,submit='Save'){const d=document.createElement('dialog');d.innerHTML=`<form><div class="dialoghead"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="iconbtn" type="button" data-dialog-cancel aria-label="Close">${icon('x')}</button></div><div class="dialogbody"><div class="formgrid">${fields.map(f=>fieldHtml(f,values[f.name])).join('')}</div></div><div class="dialogfoot"><button class="btn" type="button" data-dialog-cancel>Cancel</button><button class="btn primary" id="dialog-save" type="button">${submit}</button></div></form>`;document.body.appendChild(d);d.showModal();$$('[data-dialog-cancel]',d).forEach(b=>b.onclick=()=>d.close());d.addEventListener('cancel',e=>{e.preventDefault();d.close()});$('#dialog-save',d).onclick=async()=>{const btn=$('#dialog-save',d);if(btn.disabled)return;try{const form=$('form',d);if(!form.reportValidity())return;btn.disabled=true;const fd=new FormData(form),obj=Object.fromEntries(fd);$$('input[type=checkbox]',d).forEach(x=>obj[x.name]=x.checked);await onSubmit(obj);d.close()}catch(e){toast(e.message)}finally{if(d.open)btn.disabled=false}};d.addEventListener('close',()=>d.remove())}
function fieldHtml(f,v){
 const val=v??f.value??'',htmlId='dialog-field-'+String(f.name).replace(/[^a-z0-9_-]/gi,'-');
 if(f.type==='select')return `<div class="field ${f.full?'full':''}"><label for="${htmlId}">${f.label}</label><select id="${htmlId}" name="${f.name}" ${f.required?'required':''}>${f.options.map(o=>{const x=Array.isArray(o)?o:[o,o];return `<option value="${esc(x[0])}" ${String(val)===String(x[0])?'selected':''}>${esc(x[1])}</option>`}).join('')}</select></div>`;
 if(f.type==='textarea')return `<div class="field full"><label for="${htmlId}">${f.label}</label><textarea id="${htmlId}" name="${f.name}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea></div>`;
 if(f.type==='checkbox')return `<div class="field ${f.full?'full':''}"><label><input type="checkbox" name="${f.name}" ${val?'checked':''}> ${f.label}</label></div>`;
 return `<div class="field ${f.full?'full':''}"><label for="${htmlId}">${f.label}</label><input id="${htmlId}" name="${f.name}" type="${f.type||'text'}" value="${esc(val)}" ${f.required?'required':''} ${f.min?`min="${f.min}"`:''} placeholder="${esc(f.placeholder||'')}"></div>`;

async function selectCurrency(code){
  const list=document.querySelector('#currency-options');
  if(!list||![...list.querySelectorAll('[data-currency]')].some(b=>b.dataset.currency===code))return;
  const input=document.querySelector('#currency-search');
  if(input)input.value=code;
  list.hidden=true;
  if(state.prefs.currency===code){toast(code+' selected');return}
  state.prefs.currency=code;
  syncNumberFormatFromCurrency(code);
  await persist(code+' saved');
}

const LOCAL_HELP = {"es":[["Primeros pasos","1. Crea una meta de ahorro con el importe que deseas conseguir y, si quieres, una fecha límite. 2. Añade una cuenta de ahorro si quieres indicar dónde guardas el dinero. 3. Registra una aportación real: solo las aportaciones registradas aumentan el ahorro. 4. Usa el plan mensual y las programaciones para organizarte. 5. Haz copias de seguridad desde Privacidad y datos."],["Panel de control","El panel reúne el dinero ahorrado para metas y fondos activos, el progreso de cada meta, el ahorro del mes, las aportaciones recientes, las programaciones futuras, los hitos y la evolución frente al mes anterior. Las cifras provienen de tus registros reales, no del saldo bancario."],["Metas de ahorro","Crea una meta con nombre, importe, fecha y categoría. Añade aportaciones para aumentar su progreso. Desde Más puedes editarla, ponerla en pausa, reanudarla o archivarla. Solo puedes marcar una meta como completada cuando alcance su objetivo; una meta completada deja de aceptar nuevas aportaciones."],["Aportaciones","Una aportación es dinero ahorrado de verdad. Elige una meta o fondo, introduce el importe, la fecha y opcionalmente la cuenta y las notas. Editar o eliminar una aportación corrige el progreso correspondiente. El historial muestra diez registros por página, con los más recientes primero."],["Cuentas de ahorro","Sirven para identificar dónde guardas el dinero, por ejemplo en un banco o en efectivo. El saldo inicial no cuenta como aportación a una meta. La vista de historial permite revisar las aportaciones vinculadas. Esta herramienta no se conecta a bancos."],["Fondos para gastos futuros","Los fondos para gastos previstos permiten ahorrar para reparaciones, seguros, regalos u otros pagos futuros. Se manejan como las metas: registra aportaciones reales y observa cuánto falta para alcanzar el importe objetivo."],["Hitos","La aplicación registra automáticamente hitos de progreso del 25 %, 50 %, 75 % y 100 %, además de los personalizados de una meta. Los hitos reflejan las aportaciones reales y se muestran quince por página."],["Planificador de metas","Introduce el importe objetivo, lo que ya has ahorrado, una fecha y la frecuencia. El planificador calcula lo que falta y cuánto tendrías que aportar para cumplir la meta. Estos cálculos son orientativos y no registran dinero por sí mismos."],["Plan mensual de ahorro","Define cuánto te propones ahorrar este mes y reparte el importe entre metas y fondos. El total previsto es un plan; el total real se calcula exclusivamente a partir de las aportaciones registradas durante el mes."],["Programación de aportaciones","Crea aportaciones futuras semanales, quincenales, mensuales o con un intervalo personalizado. Una programación no aumenta el ahorro automáticamente: debe registrarse cuando se realice. Puedes pausarla, reanudarla, editarla o eliminarla."],["Retos de ahorro","Los retos ayudan a desarrollar un hábito de ahorro. Puedes iniciar un reto, aportar dinero a la meta vinculada y revisar su progreso. Los botones de acciones secundarias están en Más. Las aportaciones reales son las únicas que aumentan el dinero ahorrado."],["Calendario","El calendario muestra aportaciones realizadas, fechas objetivo, programaciones e hitos. Al pulsar un evento se abre un detalle con su fecha, estado e importe si corresponde. Los eventos no son pagos automáticos."],["Informes de progreso","Elige un periodo para ver cuánto has ahorrado, el número de aportaciones, la media, la evolución por meses y el progreso de las metas. También puedes imprimir o guardar como PDF cuando haya datos. Los meses sin actividad se muestran como cero."],["Historial de metas","Consulta metas pausadas, archivadas o completadas y sus importes históricos. No confundas el historial con la lista de metas activas. Antes de borrar definitivamente una meta, crea una copia de seguridad."],["Análisis del ahorro","Los análisis muestran el mejor mes de ahorro, el objetivo que recibió más aportaciones, el promedio mensual y la regularidad de los registros. Todos los resultados se calculan a partir de aportaciones reales."],["Notificaciones","La campana muestra avisos locales que puedes marcar como leídos o descartar. En Configuración → Notificaciones puedes activar o desactivar cada categoría. Los avisos funcionan dentro de la aplicación; no son mensajes enviados por internet."],["Seguridad y recuperación","El PIN es opcional y está desactivado por defecto. Protege la pantalla de la aplicación, pero no cifra la base de datos. Guarda la clave de recuperación fuera de la aplicación. Si olvidas el PIN, utiliza esa clave. Sin ambos, necesitarás restablecer los datos locales y restaurar una copia de seguridad."],["Copias de seguridad y restauración","En Configuración → Privacidad y datos puedes crear copias JSON, restaurar una copia compatible o exportar las aportaciones a CSV. Los datos están guardados localmente en el navegador; cambiar de navegador o de ubicación del archivo puede hacer necesario restaurar una copia."],["Solución de problemas","Si el progreso parece incorrecto, revisa las aportaciones duplicadas o editadas. Si una programación no aumentó el ahorro, regístrala como aportación. Si falta una sección, revisa Gestión de navegación. Si faltan notificaciones, comprueba sus ajustes. Si los datos desaparecen al abrir otro navegador, restaura una copia compatible."]],"fr":[["Premiers pas","1. Créez un objectif d’épargne avec le montant souhaité et, si besoin, une date cible. 2. Ajoutez un compte d’épargne pour indiquer où se trouve l’argent. 3. Enregistrez une contribution réelle : seules les contributions enregistrées augmentent l’épargne. 4. Utilisez le plan mensuel et les programmations pour vous organiser. 5. Sauvegardez vos données dans Confidentialité et données."],["Tableau de bord","Le tableau de bord rassemble l’épargne des objectifs et fonds actifs, la progression des objectifs, l’épargne du mois, les contributions récentes, les programmations à venir, les étapes franchies et la comparaison avec le mois précédent. Les chiffres proviennent des données enregistrées, pas du solde bancaire."],["Objectifs d’épargne","Créez un objectif avec un nom, un montant, une date et une catégorie. Ajoutez des contributions pour progresser. Le menu Plus permet de modifier, mettre en pause, reprendre ou archiver l’objectif. Vous ne pouvez le terminer qu’une fois la cible atteinte ; un objectif terminé n’accepte plus de contributions."],["Contributions","Une contribution correspond à une épargne réelle. Choisissez un objectif ou un fonds, saisissez le montant, la date et éventuellement le compte et les notes. La modification ou la suppression corrige la progression correspondante. L’historique affiche dix entrées par page, les plus récentes d’abord."],["Comptes d’épargne","Elles servent à préciser où vous conservez votre argent, par exemple à la banque ou en espèces. Le solde initial ne compte pas comme contribution à un objectif. La vue historique permet de consulter les contributions liées. Aucun compte bancaire n’est connecté."],["Fonds dédiés","Les fonds dédiés permettent d’épargner pour des réparations, des assurances, des cadeaux ou d’autres dépenses futures. Ils fonctionnent comme les objectifs : enregistrez des contributions réelles et suivez le montant restant."],["Étapes franchies","L’application enregistre automatiquement les étapes de progression de 25 %, 50 %, 75 % et 100 %, ainsi que les étapes personnalisées d’un objectif. Elles reflètent les contributions réelles et s’affichent à raison de quinze par page."],["Planificateur d’objectifs","Saisissez la cible, l’épargne actuelle, une date et une fréquence. Le planificateur calcule le montant restant et les contributions nécessaires. Ces résultats servent à planifier et n’enregistrent pas d’épargne réelle."],["Plan mensuel d’épargne","Définissez combien vous souhaitez épargner ce mois-ci et répartissez ce montant entre objectifs et fonds. Le total prévu est un plan ; le total réel provient uniquement des contributions enregistrées pendant le mois."],["Programmation des contributions","Programmez des contributions hebdomadaires, toutes les deux semaines, mensuelles ou personnalisées. Une programmation n’augmente pas automatiquement l’épargne : elle doit être enregistrée lorsqu’elle est réalisée. Elle peut être mise en pause, reprise, modifiée ou supprimée."],["Défis d’épargne","Les défis aident à prendre une habitude d’épargne. Vous pouvez lancer un défi, contribuer à l’objectif lié et suivre sa progression. Les actions secondaires se trouvent dans Plus. Seules les contributions réellement enregistrées augmentent l’épargne."],["Calendrier","Le calendrier affiche les contributions effectuées, les dates cibles, les programmations et les étapes. Un clic sur un événement ouvre ses détails : date, statut et montant si nécessaire. Les événements ne sont pas des paiements automatiques."],["Rapports de progression","Choisissez une période pour voir l’épargne totale, le nombre de contributions, la moyenne, l’évolution mensuelle et la progression des objectifs. Vous pouvez imprimer ou enregistrer au format PDF lorsqu’il existe des données. Les mois sans activité affichent zéro."],["Historique des objectifs","Consultez les objectifs en pause, archivés ou terminés et leurs montants historiques. L’historique est distinct de la liste des objectifs actifs. Sauvegardez les données avant toute suppression définitive."],["Analyse de l’épargne","Les analyses présentent le meilleur mois d’épargne, l’objectif le mieux financé, la moyenne mensuelle et la régularité des contributions. Tous les résultats sont calculés à partir des contributions réelles."],["Notifications","La cloche affiche des notifications locales que vous pouvez marquer comme lues ou ignorer. Dans Paramètres → Notifications, vous pouvez activer ou désactiver les catégories. Les notifications fonctionnent dans l’application, sans messages envoyés par Internet."],["Sécurité et récupération","Le PIN est facultatif et désactivé par défaut. Il protège l’écran de l’application, mais ne chiffre pas la base de données. Conservez la clé de récupération hors de l’application. En cas d’oubli du PIN, utilisez cette clé. Sans les deux, il faut réinitialiser les données locales et restaurer une sauvegarde."],["Sauvegarde et restauration","Dans Paramètres → Confidentialité et données, vous pouvez créer des sauvegardes JSON, restaurer un fichier compatible ou exporter les contributions au format CSV. Les données sont locales au navigateur ; si vous changez de navigateur ou d’emplacement du fichier, une restauration peut être nécessaire."],["Dépannage","Si la progression semble incorrecte, vérifiez les contributions doublées ou modifiées. Si une programmation n’a pas augmenté l’épargne, enregistrez-la comme contribution. Si une rubrique manque, vérifiez la Gestion de la navigation. Pour les notifications, contrôlez les réglages. Si les données semblent absentes dans un autre navigateur, restaurez une sauvegarde compatible."]]};

function dataProtectedText(str){
  if(!state||!str)return false;
  for(const list of ['goals','sinkingFunds','accounts','challenges','categories','schedules','contributions']){
    for(const r of (state[list]||[])){
      if(r.name===str||r.notes===str){if(list==='categories'&&/^cat\d+$/.test(String(r.id))&&['Emergency Fund','Vacation','Home','Car','Education','Wedding','Technology','Health','Business','Family','Other'].includes(r.name)&&r.id==='cat'+['Emergency Fund','Vacation','Home','Car','Education','Wedding','Technology','Health','Business','Family','Other'].indexOf(r.name))continue;return true;}
    }
  }
  return false;
}
function localizeTree(root){
  if(!root)return;
  const lang=state?.prefs?.language||'en';document.documentElement.setAttribute('lang',lang);
  if(lang==='en')return;
  try{
    const protectedTags=new Set(['SCRIPT','STYLE','TEXTAREA','CODE','PRE']);
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    for(const n of nodes){const parent=n.parentElement;if(!parent||protectedTags.has(parent.tagName)||parent.closest('[translate="no"],[data-user-content]'))continue;const original=n.nodeValue;
      if(dataProtectedText(original?.trim()))continue;
      const translated=localizedValue(original);if(translated!==original)n.nodeValue=translated;
    }
    const elements=(root.nodeType===1?[root,...root.querySelectorAll('*')]:[]);
    for(const el of elements){if(el.closest('[translate="no"],[data-user-content]'))continue;
      for(const attr of ['placeholder','title','aria-label']){
        const original=el.getAttribute(attr);if(!original||dataProtectedText(original.trim()))continue;
        const translated=localizedValue(original);if(translated!==original)el.setAttribute(attr,translated);
      }
    }
  }catch(e){console.warn('Localization issue',e)}
}
const translationObserver=new MutationObserver(changes=>{
  if(!state?.prefs?.language||state.prefs.language==='en')return;
  for(const record of changes){for(const node of record.addedNodes){if(node.nodeType===1||node.nodeType===3)localizeTree(node)}}
});

document.addEventListener('invalid',event=>{const lang=state?.prefs?.language||'en';if(lang==='en')return;const input=event.target;if(!input||!input.setCustomValidity)return;const validity=input.validity;
  const errors={es:{required:'Completa este campo.',format:'Introduce un valor válido.',range:'El valor está fuera del intervalo permitido.'},fr:{required:'Veuillez remplir ce champ.',format:'Saisissez une valeur valide.',range:'La valeur est hors de la plage autorisée.'}};
  const labels=errors[lang];if(!labels)return;
  const message=validity.valueMissing?labels.required:(validity.rangeOverflow||validity.rangeUnderflow)?labels.range:labels.format;
  input.setCustomValidity(message);
},true);
document.addEventListener('input',event=>{if(event.target?.validity?.customError)event.target.setCustomValidity('')},true);

 }
